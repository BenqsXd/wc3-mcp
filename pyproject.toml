[project]
name = "wc3mcp"
version = "1.6.0"
description = "MCP server for making Warcraft III maps and operating the World Editor"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["mcp>=1.27,<2", "pywin32>=306", "numpy>=2", "pillow>=11"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
  "editor: drives the World Editor (run on demand)",
  "game: launches Warcraft III (run on demand)",
]
addopts = "-m 'not editor and not game'"
