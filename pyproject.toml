[project]
name = "wc3mcp"
version = "1.14.0"
description = "MCP server for making Warcraft III maps and operating the World Editor"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["mcp>=1.27,<2", "pywin32>=306", "numpy>=2", "pillow>=11"]

[project.scripts]
# `uvx --from git+https://github.com/BenqsXd/wc3-mcp wc3-mcp` (or pip install) starts the server in any MCP client
wc3-mcp = "wc3mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wc3mcp"]

[tool.uv]
package = false   # plugins run the repo as it is (uv run python -m wc3mcp.server), with nothing to build

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
  "editor: drives the World Editor (run on demand)",
  "game: launches Warcraft III (run on demand)",
]
addopts = "-m 'not editor and not game'"
